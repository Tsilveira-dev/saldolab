name: Format Local Mode Regression
on:
  push:
    branches: [feat/neon-backend-foundation]
    paths:
      - .github/workflows/format-local-mode-regression.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/context/FinanceProvider.jsx e2e/transaction-category.spec.js docs/etapas-conclusao.md
      - name: Commit formatted files only to PR branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/context/FinanceProvider.jsx e2e/transaction-category.spec.js docs/etapas-conclusao.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format local-mode validation and stage gates"
            git push origin HEAD:feat/neon-backend-foundation
          fi
