name: Format Neon Preview Fix
on:
  push:
    branches: [feat/neon-backend-foundation]
    paths:
      - '.github/workflows/format-neon-preview.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/auth/neonClient.js src/pages/CloudAccess.jsx e2e/cloud-smoke.spec.js .github/workflows/check.yml
      - name: Commit formatted changes to feature branch only
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/auth/neonClient.js src/pages/CloudAccess.jsx e2e/cloud-smoke.spec.js .github/workflows/check.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: format cloud Auth regression fixes"
            git push origin HEAD:feat/neon-backend-foundation
          fi
